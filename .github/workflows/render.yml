name: Render Ink Explainer Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract project ZIP
        id: extract
        run: |
          mkdir -p project
          unzip -o ink-explainer-survival-starter.zip -d project
          echo "ZIP CONTENTS:"
          find project -maxdepth 4 -type f

      - name: Locate package.json
        id: locate
        run: |
          PACKAGE=$(find project -name package.json -type f -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm install

      - name: Check project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run typecheck

      - name: Render video
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts Main out/survival-in-the-wild.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: survival-in-the-wild
          path: project/**/out/survival-in-the-wild.mp4
          if-no-files-found: error
          
